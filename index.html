<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>17layzie — Výkup CS2 skinů</title>
<meta name="description" content="Vykupuju CS2 skiny. Napiš mi a domluvíme se na ceně.">
<meta name="theme-color" content="#0a0a0a">
<meta property="og:title" content="17layzie — Výkup CS2 skinů">
<meta property="og:description" content="Vykupuju CS2 skiny. Napiš mi a domluvíme se na ceně.">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<style>
  :root{
    --bg:#0a0a0a;
    --bg-elev:#121212;
    --bg-elev-2:#171717;
    --border:rgba(255,255,255,0.09);
    --border-strong:rgba(255,255,255,0.14);
    --text:#f2f2f0;
    --text-dim:#8c8c8a;
    --accent:#FF8C1A;
    --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI Variable Display", "Segoe UI", Helvetica, "Apple Color Emoji", Arial, sans-serif, "Segoe UI Emoji", "Segoe UI Symbol";
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{min-height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font);
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    min-height:100dvh;
    padding:
      calc(24px + env(safe-area-inset-top, 0px))
      20px
      calc(24px + env(safe-area-inset-bottom, 0px));
  }

  .bg{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    z-index:-1;
    pointer-events:none;
    user-select:none;
  }

  .page{
    width:100%;
    max-width:440px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  /* profile */
  .avatar{margin-bottom:18px;}
  .avatar img{display:block; height:140px; width:auto;}
  .name{
    font-size:22px;
    font-weight:700;
    letter-spacing:-0.01em;
    margin-bottom:10px;
  }
  .bio{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:34px;
  }
  .headline{
    display:inline-block;
    font-size:20px;
    font-weight:700;
    letter-spacing:-0.01em;
    line-height:1.25;
    padding:0 1px 3px;
    margin-bottom:6px;
    background:linear-gradient(90deg,#f2f2f0 0%,#FF8C1A 25%,#f2f2f0 50%,#FF8C1A 75%,#f2f2f0 100%);
    background-size:200% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
    animation:sweep 3.6s linear infinite;
  }
  .subline{
    font-size:16px;
    line-height:1.5;
    color:var(--text-dim);
    max-width:320px;
  }
  .points{
    list-style:none;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:6px 16px;
    margin-top:14px;
  }
  .points li{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:14px;
    font-weight:500;
    color:var(--text);
  }
  .points li::before{
    content:"";
    width:6px; height:6px;
    border-radius:50%;
    background:var(--accent);
    flex-shrink:0;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(28px);}
    to{opacity:1; transform:translateY(0);}
  }
  .links > *{animation:rise .65s cubic-bezier(.16,1,.3,1) backwards;}
  .links > :nth-child(1){animation-delay:.10s;}
  .links > :nth-child(2){animation-delay:.20s;}
  .links > :nth-child(3){animation-delay:.30s;}
  .links > :nth-child(4){animation-delay:.40s;}
  .links > :nth-child(5){animation-delay:.50s;}
  @keyframes sweep{
    from{background-position:100% 0;}
    to{background-position:0% 0;}
  }
  @media (prefers-reduced-motion: reduce){
    .headline{animation:none; background-position:50% 0;}
    .btn.primary::before, .btn.steam::before{animation:none;}
    .links > *{animation:none;}
  }

  /* buttons */
  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .btn{
    position:relative;
    isolation:isolate;
    overflow:hidden;
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    min-height:72px;
    padding:12px 18px 12px 12px;
    border-radius:20px;
    background:linear-gradient(180deg,#171717,#111);
    border:1px solid var(--border-strong);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.05), 0 8px 24px rgba(0,0,0,0.35);
    color:var(--text);
    font-family:inherit;
    text-decoration:none;
    transition:border-color .16s ease, background .16s ease, transform .12s ease;
  }
  .btn:hover{border-color:rgba(255,255,255,0.28); background:linear-gradient(180deg,#1b1b1b,#131313);}
  .btn:active{transform:scale(0.985);}
  .btn:focus-visible{outline:2px solid var(--accent); outline-offset:3px;}

  .ico{
    width:44px; height:44px;
    flex-shrink:0;
    border-radius:13px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.18);
  }
  .ico svg{width:24px; height:24px; color:#fff;}
  .ico.discord{background:#5865F2;}
  .ico.steam{background:linear-gradient(135deg,#2a475e,#171a21); box-shadow:inset 0 1px 0 rgba(255,255,255,0.18), 0 0 0 1px rgba(255,255,255,0.08);}
  .sep{height:1px; background:var(--border); margin:6px 28px;}
  .ico.instagram{background:radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);}

  .label{
    flex:1;
    text-align:left;
    font-size:16.5px;
    font-weight:600;
    letter-spacing:0.02em;
    line-height:1.3;
    text-wrap:balance;
  }
  .arrow{
    width:20px; height:20px;
    flex-shrink:0;
    color:var(--text-dim);
    transition:transform .16s ease, color .16s ease;
  }
  .btn:hover .arrow{transform:scale(1.12); color:var(--text);}

  .btn.primary{
    border-color:rgba(255,140,26,0.45);
    background:linear-gradient(180deg, rgba(255,140,26,0.10), rgba(255,140,26,0.03)), #111;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.05), 0 8px 28px rgba(255,140,26,0.08);
  }
  .btn.primary:hover{border-color:rgba(255,140,26,0.7);}
  .btn.primary .arrow{color:var(--accent);}
  .btn.primary{--sweep:rgba(255,140,26,0.13); --sweep0:rgba(255,140,26,0);}
  .btn.steam{--sweep:rgba(102,192,244,0.10); --sweep0:rgba(102,192,244,0);}
  .btn.primary::before,
  .btn.steam::before{
    content:"";
    position:absolute;
    inset:0;
    z-index:-1;
    pointer-events:none;
    background:linear-gradient(90deg, var(--sweep0) 0%, var(--sweep) 25%, var(--sweep0) 50%, var(--sweep) 75%, var(--sweep0) 100%);
    background-size:200% 100%;
    animation:sweep 3.6s linear infinite;
  }
  .btn.steam::before{animation-delay:-1.8s;}


</style>
</head>
